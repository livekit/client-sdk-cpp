name: Publish docs

on:
  release:
    # "published" covers newly published stable releases and prereleases.
    # "released" also catches promotion of an existing prerelease to stable.
    types: [published, released]
  # CI calls this on every pull request and main push. Only the credentials
  # job runs there; validate and publish stay on the release trigger.
  workflow_call:
    secrets:
      DOCS_DEPLOY_AWS_ACCESS_KEY:
        required: false
      DOCS_DEPLOY_AWS_API_SECRET:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate (build docs)
    if: github.event_name == 'release'
    uses: ./.github/workflows/generate-docs.yml
    with:
      version: ${{ github.event.release.tag_name }}
      upload_artifact: true
      # Suffix with run_id so concurrent publish runs cannot collide on the
      # artifact namespace within the same repository.
      artifact_name: livekit-cpp-docs-${{ github.run_id }}

  publish:
    name: Publish (S3 + CloudFront)
    needs: validate
    # The GitHub release is the source of truth. Drafts do not emit these
    # events until published; prereleases validate docs but never deploy them.
    # event_name keeps a CI workflow_call from publishing.
    if: github.event_name == 'release' && github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: html

      - name: S3 Upload
        run: |
          DOCS_DIR="html"
          if [[ ! -d "$DOCS_DIR" ]]; then
            echo "Expected docs at $DOCS_DIR but directory not found."
            exit 1
          fi

          VERSIONED_PREFIX="s3://livekit-docs/client-sdk-cpp/${{ needs.validate.outputs.project_number }}"
          LATEST_PREFIX="s3://livekit-docs/client-sdk-cpp"

          # Upload immutable versioned docs, then refresh rolling latest.
          aws s3 cp "$DOCS_DIR"/ "$VERSIONED_PREFIX" --recursive
          aws s3 cp "$DOCS_DIR"/ "$LATEST_PREFIX" --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOCS_DEPLOY_AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCS_DEPLOY_AWS_API_SECRET }}
          AWS_DEFAULT_REGION: "us-east-1"

      - name: Invalidate cloudfront cache
        run: |
          aws cloudfront create-invalidation --distribution-id EJJ40KLJ3TRY9 --paths "/client-sdk-cpp/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOCS_DEPLOY_AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCS_DEPLOY_AWS_API_SECRET }}
          AWS_DEFAULT_REGION: "us-east-1"

  # Proves the docs-deploy key is still a real AWS access key. This is the
  # failure mode from v1.10.2 onward (InvalidAccessKeyId). It does not upload
  # or invalidate CloudFront; those permissions are still exercised on release.
  credentials:
    name: Check AWS credentials
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Verify docs deploy credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOCS_DEPLOY_AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCS_DEPLOY_AWS_API_SECRET }}
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "Docs deploy AWS credentials are not available to this workflow."
            exit 1
          fi
          aws sts get-caller-identity --query Arn --output text
