name: Build SDK
description: Configure and build an SDK variant with the repository build scripts.
inputs:
  preset:
    description: Build script command, such as release-examples or debug-tests.
    required: true
  capture:
    description: Capture sources (all, none, or gstreamer,pattern,clock).
    default: 'none'
  bundle-dir:
    description: Optional installation directory for an SDK bundle.
    default: ''
  version:
    description: Optional SDK version to inject.
    default: ''
  macos-arch:
    description: Optional macOS architecture override.
    default: ''
runs:
  using: composite
  steps:
    - name: Build (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SDK_PRESET: ${{ inputs.preset }}
        SDK_CAPTURE: ${{ inputs.capture }}
        SDK_BUNDLE_DIR: ${{ inputs.bundle-dir }}
        SDK_VERSION: ${{ inputs.version }}
        SDK_MACOS_ARCH: ${{ inputs.macos-arch }}
      run: |
        args=(./build.sh "$SDK_PRESET")
        case "$SDK_CAPTURE" in
          all) args+=(--capture) ;;
          none|"") args+=(--no-capture) ;;
          *) args+=(--capture="$SDK_CAPTURE") ;;
        esac
        if [[ -n "$SDK_BUNDLE_DIR" ]]; then args+=(--bundle --prefix "$SDK_BUNDLE_DIR"); fi
        if [[ -n "$SDK_VERSION" ]]; then args+=(--version "$SDK_VERSION"); fi
        if [[ -n "$SDK_MACOS_ARCH" ]]; then args+=(--macos-arch "$SDK_MACOS_ARCH"); fi
        "${args[@]}"
    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SDK_PRESET: ${{ inputs.preset }}
        SDK_CAPTURE: ${{ inputs.capture }}
        SDK_BUNDLE_DIR: ${{ inputs.bundle-dir }}
        SDK_VERSION: ${{ inputs.version }}
      run: |
        $buildArgs = @($env:SDK_PRESET)
        switch ([string]$env:SDK_CAPTURE) {
          'all' { $buildArgs += '--capture'; break }
          { $_ -in @('none', '') } { $buildArgs += '--no-capture'; break }
          default { $buildArgs += "--capture=$($env:SDK_CAPTURE)" }
        }
        if ($env:SDK_BUNDLE_DIR) { $buildArgs += @('--bundle', '--prefix', $env:SDK_BUNDLE_DIR) }
        if ($env:SDK_VERSION) { $buildArgs += @('--version', $env:SDK_VERSION) }
        & .\build.cmd @buildArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
