name: Check SDK exported ABI
description: Reject private dependency symbols exported by an installed SDK.
inputs:
  bundle-dir:
    description: SDK installation directory relative to the workspace.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SDK_BUNDLE_DIR: ${{ inputs.bundle-dir }}
      run: |
        case "$RUNNER_OS" in
          Windows) lib="$SDK_BUNDLE_DIR/bin/livekit.dll" ;;
          macOS) lib="$SDK_BUNDLE_DIR/lib/liblivekit.dylib" ;;
          Linux) lib="$SDK_BUNDLE_DIR/lib/liblivekit.so" ;;
          *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        python .github/scripts/check_no_private_symbols.py "$lib"
