name: Set Cargo output root
description: Use a short Cargo root on Windows and the submodule target directory elsewhere.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "CARGO_TARGET_DIR=$(cygpath -m "$RUNNER_TEMP")/lk-rust" >> "$GITHUB_ENV"
        else
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/client-sdk-rust/target" >> "$GITHUB_ENV"
        fi
