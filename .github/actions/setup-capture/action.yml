name: Set up capture dependencies
description: Install GStreamer development files and runtime plugins for capture bundles.
runs:
  using: composite
  steps:
    - name: Install GStreamer (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # Request the distro unwinder explicitly so apt can replace conflicting
        # LLVM unwinder development packages on Ubuntu 22.04 runners.
        sudo apt-get install -y libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
    - name: Install GStreamer (macOS)
      if: runner.os == 'macOS'
      env:
        GSTREAMER_MACOS_VERSION: "1.28.5"
        GSTREAMER_MACOS_RUNTIME_SHA256: "0a8fc7a1cf8d7bac833ca0ebe2fd196a199c2465e810cd5b1e4b4f720c258f43"
        GSTREAMER_MACOS_DEVEL_SHA256: "6f7b55e8fb86dcc615c9cae46b79b7785851e5c77f79a938648a81dfa2603729"
      shell: bash
      run: |
        set -euo pipefail
        # Official universal packages cover both x86_64 and arm64. Homebrew
        # no longer produces Intel bottles and may compile its dependency tree.
        base_url="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_MACOS_VERSION"
        installer_dir="$RUNNER_TEMP/gstreamer-installers"
        runtime_pkg="gstreamer-1.0-$GSTREAMER_MACOS_VERSION-universal.pkg"
        devel_pkg="gstreamer-1.0-devel-$GSTREAMER_MACOS_VERSION-universal.pkg"
        mkdir -p "$installer_dir"

        for package in "$runtime_pkg" "$devel_pkg"; do
          expected_hash="$GSTREAMER_MACOS_RUNTIME_SHA256"
          if [[ "$package" == "$devel_pkg" ]]; then
            expected_hash="$GSTREAMER_MACOS_DEVEL_SHA256"
          fi
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            "$base_url/$package" --output "$installer_dir/$package"
          printf '%s  %s\n' "$expected_hash" "$installer_dir/$package" | shasum -a 256 -c -
        done

        # Verify both downloads before installing either package.
        sudo installer -pkg "$installer_dir/$runtime_pkg" -target /
        sudo installer -pkg "$installer_dir/$devel_pkg" -target /

        framework="/Library/Frameworks/GStreamer.framework/Versions/1.0"
        echo "$framework/bin" >> "$GITHUB_PATH"
        export PATH="$framework/bin:$PATH"
        export PKG_CONFIG_PATH="$framework/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
        echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
        # The framework dylibs use @rpath. Rust sys-crate linker arguments do
        # not propagate to the final FFI dylib, so set its runtime search path.
        echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,-rpath,$framework/lib" >> "$GITHUB_ENV"
        pkg-config --modversion gstreamer-1.0 gstreamer-app-1.0
        gst-inspect-1.0 --version
    - name: Install GStreamer (Windows)
      if: runner.os == 'Windows'
      env:
        GSTREAMER_WINDOWS_VERSION: "1.28.5"
        GSTREAMER_WINDOWS_SHA256: "51ee5eaec33008e8409d8cf6f6884457f22aa3bd515f8856f993a3eaab903530"
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP "gstreamer-installer.exe"
        $installDir = Join-Path $env:RUNNER_TEMP "gstreamer"
        $uri = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_WINDOWS_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_WINDOWS_VERSION.exe"

        Invoke-WebRequest -Uri $uri -OutFile $installer
        $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
        if ($actualHash -ne $env:GSTREAMER_WINDOWS_SHA256) {
          throw "GStreamer installer SHA-256 mismatch: expected $env:GSTREAMER_WINDOWS_SHA256, got $actualHash"
        }

        $process = Start-Process -FilePath $installer -ArgumentList @(
          "/TYPE=devel",
          "/DIR=$installDir",
          "/CURRENTUSER",
          "/VERYSILENT",
          "/NORESTART"
        ) -Wait -PassThru
        if ($process.ExitCode -ne 0) {
          throw "GStreamer installer failed with exit code $($process.ExitCode)"
        }

        "$installDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "PKG_CONFIG_PATH=$installDir\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
